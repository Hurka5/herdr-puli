<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <!-- agent -->
  <rect x="20" y="44" width="150" height="56" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="95" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">agent</text>
  <text x="95" y="86" text-anchor="middle" font-size="11" fill="#6b7280">OpenCode session</text>

  <!-- queue -->
  <rect x="240" y="44" width="140" height="56" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="310" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">review queue</text>

  <!-- panel -->
  <rect x="470" y="20" width="260" height="104" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="600" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Commits panel</text>
  <rect x="496" y="58" width="150" height="8" rx="4" fill="#86efac"/>
  <rect x="496" y="74" width="208" height="8" rx="4" fill="#d1d5db"/>
  <rect x="512" y="90" width="120" height="8" rx="4" fill="#fca5a5"/>
  <rect x="640" y="90" width="64" height="8" rx="4" fill="#86efac"/>

  <!-- git -->
  <rect x="470" y="180" width="260" height="56" rx="12" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="600" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">puli runs git</text>
  <text x="600" y="222" text-anchor="middle" font-size="11" fill="#6b7280">commit · push · merge · rebase</text>

  <!-- history -->
  <rect x="790" y="180" width="110" height="56" rx="26" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="845" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">history</text>

  <!-- arrows -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <line x1="170" y1="72" x2="232" y2="72" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="201" y="62" text-anchor="middle" font-size="11" fill="#64748b">propose</text>

  <line x1="380" y1="72" x2="462" y2="72" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="421" y="62" text-anchor="middle" font-size="11" fill="#64748b">waits</text>

  <line x1="600" y1="124" x2="600" y2="172" stroke="#16a34a" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="612" y="152" font-size="11" fill="#16a34a">approve</text>

  <line x1="730" y1="208" x2="782" y2="208" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M 470 100 C 380 150, 200 150, 103 106" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#dc2626">reject + line comments</text>
</svg>
